---
baseURL: https://ignes.com/
locale: en-us
title: FOSS Debloat Directory
theme: hextra

taxonomies:
  category: categories
  tag: tags
  replaces: replaces

# Enable Hextra features
markup:
  goldmark:
    renderer:
      unsafe: true  # Allows HTML shortcodes like cards
  highlight:
    noClasses: false

# Navigation Header Bar
menu:
  main:
    - name: All Tools
      pageRef: /tools
      weight: 1

    - name: Categories
      identifier: categories
      weight: 2

    - name: Images & Media
      pageRef: /tools/images
      parent: categories
      weight: 1

    - name: Utilities
      pageRef: /tools/utilities
      parent: categories
      weight: 2

    - name: Audio
      pageRef: /tools/audio
      parent: categories
      weight: 3

    - name: Documents
      pageRef: /tools/documents
      parent: categories
      weight: 4

    - name: Notes
      pageRef: /tools/notes
      parent: categories
      weight: 5

    - name: Security
      pageRef: /tools/security
      parent: categories
      weight: 6

    - name: Development
      pageRef: /tools/development
      parent: categories
      weight: 7

    - name: Tags
      pageRef: /tags
      weight: 8

    - name: Search
      weight: 9
      params:
        type: search

    - name: GitHub
      weight: 10
      url: "https://github.com/riccione/ignes.com"
      params:
        icon: github

params:
  description: Clean, privacy-first open source replacements for bloated software.
  page:
    width: full
  navbar:
    displayTitle: true
    width: full
  footer:
    displayCopyright: false
    credits: "No tracking. No ads. Powered by Hugo & Hextra."
    width: full
  blog:
    list:
      displayTags: true
  toc:
    displayTags: true
